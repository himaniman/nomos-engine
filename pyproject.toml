[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nomos-engine"
version = "0.1.0"
description = "Artificial physics playground: a DSL for laws of nature, a grid world that lives by them, and an observer that reports what emerged."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["nomos"]
